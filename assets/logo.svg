<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" >
  <title id="title">Nifty &amp; Beyond</title>
  <desc id="desc">Premium navy and gold financial logo with rising candlesticks and the tagline What the index doesn't tell you.</desc>
  <defs>
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B77912"></stop>
      <stop offset="45%" stop-color="#D89B2B"></stop>
      <stop offset="100%" stop-color="#F2C45C"></stop>
    </linearGradient>
    <linearGradient id="bars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#BFC3C7"></stop>
      <stop offset="55%" stop-color="#D8D0BF"></stop>
      <stop offset="100%" stop-color="#D89B2B"></stop>
    </linearGradient>
  </defs>

  

  
  <text x="70" y="315" font-family="Georgia, 'Times New Roman', serif" font-size="205" font-weight="700" letter-spacing="-9" fill="#082342">Nifty</text>

  
  <text x="90" y="505" font-family="Georgia, 'Times New Roman', serif" font-size="175" font-weight="700" fill="url(#gold)">&amp;</text>

  <text x="285" y="505" font-family="Georgia, 'Times New Roman', serif" font-size="178" font-weight="700" letter-spacing="-7" fill="#082342">Beyond</text>

  
  <g fill="url(#bars)">
    <rect x="700" y="270" width="34" height="70" rx="3"></rect>
    <rect x="765" y="230" width="34" height="105" rx="3"></rect>
    <rect x="830" y="185" width="34" height="115" rx="3"></rect>
    <rect x="895" y="135" width="34" height="115" rx="3"></rect>
    <rect x="960" y="85" width="34" height="105" rx="3"></rect>
  </g>
  <g stroke="url(#bars)" stroke-width="7" stroke-linecap="round">
    <path d="M717 250v-28 M717 340v28"></path>
    <path d="M782 210v-30 M782 335v30"></path>
    <path d="M847 165v-30 M847 300v30"></path>
    <path d="M912 115v-30 M912 250v30"></path>
    <path d="M977 65v-30 M977 190v30"></path>
  </g>

  
  <path d="M650 365 C760 360, 820 335, 875 285 C925 240, 965 180, 1005 105" fill="none" stroke="url(#gold)" stroke-width="28" stroke-linecap="round"></path>
  <path d="M1005 105 L950 122 L1007 48 Z" fill="url(#gold)"></path>

  
  <line x1="85" y1="585" x2="280" y2="585" stroke="url(#gold)" stroke-width="7"></line>
  <text x="305" y="604" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="400" fill="#082342">What the index doesn’t tell you</text>
  <line x1="940" y1="585" x2="1115" y2="585" stroke="url(#gold)" stroke-width="7"></line>
</svg>